[package]
name = "task-store"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = [
    "oracle-manager/testutils",
    "price-oracle/testutils",
    "soroban-sdk/testutils",
]

[dependencies]
soroban-sdk = { version = "=22.0.11" }

[dev-dependencies]
soroban-sdk = { version = "=22.0.11", features = ["testutils"] }
oracle-manager = { path = "../oracle_manager", features = ["testutils"] }
price-oracle = { path = "../price_oracle", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
