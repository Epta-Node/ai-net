[package]
name = "agent_registry"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "=22.0.11" }
# default-features = false drops the UpgradeManager contract entry points.
# Only the Upgradeable trait and the shared version/migration types are needed
# here, and a dependency exporting contract symbols collides with this
# contract's own exports when linking the wasm.
upgrade-manager = { path = "../upgrade-manager", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "=22.0.11", features = ["testutils"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
# Test-only: the real resolver contract is registered in the test Env. Kept out
# of [dependencies] so its exported symbols never link into this contract's wasm.
error-resolver = { path = "../error-resolver", default-features = false, features = ["contract"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Tests register the real UpgradeManager contract in the test Env, so they need
# its entry points; the wasm build above does not.
upgrade-manager = { path = "../upgrade-manager", features = ["contract"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true