[workspace]
members = [
    "contracts/agent_registry",
    "contracts/error-resolver",
    "contracts/error-registry",
    "contracts/agent_bidding",
    "contracts/agent_governance",
    "contracts/upgrade-manager",
    "contracts/task_store",
    "contracts/agent_marketplace",
    "contracts/gas_interface",
    "contracts/dispute_resolution",
    "contracts/oracle_manager",
    "contracts/price_oracle",
    "tests/integration",
]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Release build with debug assertions (and therefore contract logs) enabled.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
