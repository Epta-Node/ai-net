[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
soroban-sdk = { version = "=22.0.11", features = ["testutils"] }
agent_registry = { path = "../../contracts/agent_registry" }
agent-bidding = { path = "../../contracts/agent_bidding" }
agent-marketplace = { path = "../../contracts/agent_marketplace" }
dispute-resolution = { path = "../../contracts/dispute_resolution" }
task-store = { path = "../../contracts/task_store" }
oracle-manager = { path = "../../contracts/oracle_manager" }
price-oracle = { path = "../../contracts/price_oracle" }
upgrade-manager = { path = "../../contracts/upgrade-manager", default-features = false }
