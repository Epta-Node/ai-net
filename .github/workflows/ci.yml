name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Node package lives in smart-contracts/ (frontend/ and backend/
        # are currently empty scaffolds with no package.json).
        working-directory: smart-contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Caches the npm download cache (~/.npm) keyed off the lockfile,
          # so repeat runs skip re-downloading packages.
          cache: npm
          cache-dependency-path: smart-contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript type-check)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
