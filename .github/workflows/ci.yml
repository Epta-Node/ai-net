name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter queries the pull request files API on PR events.
  # marocchino/sticky-pull-request-comment needs write to post/update comments.
  pull-requests: write

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'tests/e2e/**'
            frontend:
              - 'frontend/**'
              - 'tests/e2e/**'
            contracts:
              - 'smart-contracts/**'
              - '.github/workflows/ci.yml'
            compose:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.dockerignore'
              - 'tests/e2e/compose-smoke.mjs'
              - '.github/workflows/ci.yml'

  backend:
    name: backend
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Validate .env.example matches config schema
        run: npm run validate:env

      - name: Type-check and build
        run: npm run build

      - name: Enforce gzipped route bundle budgets
        run: npm run size

      - name: Unit tests & coverage
        run: npm run test:coverage

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.run_id }}
          path: backend/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: OpenAPI contract tests
        run: npm run test:contract

      - name: Performance latency budgets
        run: npm run test:performance

  frontend:
    name: frontend
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc accepts any `*.module.css`/asset path via vite/client's ambient
      # module declarations, so a missing stylesheet only fails at bundle time.
      - name: Check relative asset imports resolve
        run: npm run check:imports

      - name: Check locale key parity
        run: npm run i18n:check

      - name: Lint check
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Unit tests & coverage (vitest)
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: frontend/coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

  frontend-visual:
    name: frontend-visual-regression
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' }}
    # Deliberately does NOT `needs: [frontend]`. This suite renders four
    # specific routes through `vite dev` (an on-demand, per-module dev
    # server), not the full production bundle `frontend`'s `npm run build`
    # type-checks — so it doesn't need that job to pass, and shouldn't be
    # blocked by an unrelated tsc error in a page these tests don't visit.
    # Screenshot comparisons are inherently more environment-sensitive than
    # unit/type checks; don't block merges on this suite yet. Failures are
    # still visible on the PR checks list and via the uploaded report.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pinned to the @playwright/test version resolved in package-lock.json.
    # Visual baselines are pixel-tied to this image's fonts/rendering stack —
    # bump this tag in lockstep whenever @playwright/test is upgraded, and
    # regenerate baselines from the same image (see docs/visual-regression-testing.md).
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload visual regression report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-report
          path: frontend/playwright-report-visual/
          retention-days: 14

      - name: Upload visual diff artifacts (actual/diff/expected PNGs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Link visual diffs in job summary
        if: failure()
        run: |
          {
            echo "### Visual regression diffs detected";
            echo "Open the **playwright-visual-report** artifact attached to this run (Summary tab → Artifacts) and load \`index.html\` for side-by-side expected/actual/diff images per failing snapshot.";
            echo "Raw PNGs (actual/diff/expected) are in the **playwright-visual-diffs** artifact (\`frontend/test-results/\`).";
          } >> "$GITHUB_STEP_SUMMARY"

  visual-baseline-update:
    name: visual-baseline-update
    # Regenerates screenshot baselines in the same pinned Playwright image the
    # visual job uses and commits them back to the branch. Runs on a manual
    # dispatch, or on a push to main whose commit message has [update-snapshots].
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[update-snapshots]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: frontend
    steps:
      # The Playwright image has no git, which checkout needs to push back.
      - name: Install git
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends git

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Update visual baselines
        run: npm run test:visual:update

      - name: Commit updated baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/pages.visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Baselines already up to date."
            exit 0
          fi
          git commit -m "test: update visual baselines [skip ci]"
          git push

  contracts:
    name: smart-contracts
    # Contract checks are independent of the backend and frontend suites.
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # ── Rust resource limits ──────────────────────────────────────────
      # Run only 1 cargo job at a time (one crate compiled in parallel max).
      CARGO_BUILD_JOBS: '1'
      # 1 codegen unit = lower peak RAM; rustc won't split crates into many
      # parallel LLVM modules. Mirrors smart-contracts/.cargo/config.toml so
      # the flag is enforced even if the config file is not picked up.
      RUSTFLAGS: '-C codegen-units=1'
      # Disable incremental compilation in CI — it saves time only on local
      # re-builds; in CI it just wastes disk/RAM building the cache layer.
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: smart-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: smart-contracts/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # The Soroban contracts build for this target (see "Cargo build"
          # below); installing the target is what makes `cargo build` work.
          targets: wasm32v1-none

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: smart-contracts

      - name: Install dependencies
        run: npm ci

      # ── TypeScript SDK ────────────────────────────────────────────────
      - name: TypeScript SDK — build
        run: npm run build

      - name: TypeScript SDK — lint
        run: npm run lint

      - name: TypeScript SDK — unit tests
        run: npm run test:unit

      # ── Soroban contracts ─────────────────────────────────────────────
      - name: Cargo format check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --locked -p error-resolver -p error-registry -p agent_registry -p agent-bidding -p upgrade-manager -p agent-marketplace -p task-store -p dispute-resolution -p oracle-manager -p agent-governance --all-targets -- -D warnings

      # `--locked` keeps CI on the workspace lockfile resolution, which pins
      # ed25519-dalek to a version compatible with current stable Rust.
      - name: Cargo tests
        run: cargo test --locked -p error-resolver -p error-registry -p agent_registry -p agent-bidding -p upgrade-manager -p agent-marketplace -p task-store -p dispute-resolution -p oracle-manager -p agent-governance

      # Optimized Wasm builds for the deployable contracts.
      # (error-resolver is exercised natively above; its Wasm target is
      # currently blocked by a serde dependency that does not compile for
      # wasm32v1-none.)
      - name: Build optimized Wasm binaries
        run: |
          cargo build --locked -p agent_registry --target wasm32v1-none --release
          cargo build --locked -p error-registry --target wasm32v1-none --release
          cargo build --locked -p agent-bidding --target wasm32v1-none --release
          cargo build --locked -p agent-marketplace --target wasm32v1-none --release
          cargo build --locked -p task-store --target wasm32v1-none --release
          cargo build --locked -p dispute-resolution --target wasm32v1-none --release
          cargo build --locked -p upgrade-manager --target wasm32v1-none --release
          ls -la target/wasm32v1-none/release/*.wasm

      - name: Enforce Wasm size budgets
        run: node scripts/check-wasm-size.mjs

      - name: Upload Wasm size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-report
          path: smart-contracts/wasm-size-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Validate event topic convention
        run: node scripts/check-events.mjs

      - name: Regenerate TypeScript clients and check drift
        run: |
          npm run codegen
          git diff --exit-code -- src/generated
          test -z "$(git status --porcelain -- src/generated)"

  # ── Backend E2E: smoke (registry/list/create) ───────────────────────────────
  # Fast, deterministic smoke covering POST /api/agents/register,
  # GET /api/agents, GET /api/agents/:id and POST /api/tasks create.
  # Required, decoupled from heavy, with auto-retry (max 3 attempts).
  e2e-backend-smoke:
    name: e2e-backend-smoke (registry/list/create)
    needs: [backend, changes]
    # On PRs run only when backend paths changed; always run on push/main & dispatch
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend smoke E2E (with auto-retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 12
          max_attempts: 3
          retry_wait_seconds: 10
          command: cd backend && npx jest --config ../tests/e2e/jest.config.js --runInBand --forceExit --testPathPattern="scenario-a-registration" --json --outputFile=../test-results-backend-smoke.json
        env:
          NODE_ENV: test
          SKIP_STELLAR_ACCOUNT_VERIFY: 'true'
          STELLAR_TEST_SECRET: ${{ secrets.STELLAR_TEST_SECRET }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}

      - name: Upload backend smoke results (flake tracking)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-backend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results-backend-smoke.json
            backend/test-results-backend-smoke.json
            ../test-results-backend-smoke.json
          if-no-files-found: warn
          retention-days: 14

  # ── Backend E2E: heavy (WS/lifecycle) ───────────────────────────────────────
  # Covers task lifecycle, DAG execution, WebSocket/stream and agent
  # removal cascades. Required but decoupled from smoke; retries handle flakes.
  e2e-backend-heavy:
    name: e2e-backend-heavy (WS/lifecycle)
    needs: [backend, changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend heavy E2E (with auto-retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 18
          max_attempts: 3
          retry_wait_seconds: 15
          command: cd backend && npx jest --config ../tests/e2e/jest.config.js --runInBand --forceExit --testPathPattern="scenario-b|scenario-c|full-pipeline|agent-lifecycle" --json --outputFile=../test-results-backend-heavy.json
        env:
          NODE_ENV: test
          SKIP_STELLAR_ACCOUNT_VERIFY: 'true'
          STELLAR_TEST_SECRET: ${{ secrets.STELLAR_TEST_SECRET }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}

      - name: Upload backend heavy results (flake tracking)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-backend-heavy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results-backend-heavy.json
            backend/test-results-backend-heavy.json
            ../test-results-backend-heavy.json
          if-no-files-found: warn
          retention-days: 14

  # ── Frontend E2E: smoke (registry/list/create) ──────────────────────────────
  # Fast Playwright smoke: agent registry table + task submission DAG preview.
  # Required, decoupled from heavy, with retries=2 (config) + outer retry.
  e2e-frontend-smoke:
    name: e2e-frontend-smoke (registry/list/create)
    needs: [frontend, changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run frontend smoke E2E (with auto-retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          command: cd frontend && npx playwright test tests/e2e/agent-registry.spec.ts tests/e2e/task-submission.spec.ts --reporter=html
        env:
          CI: 'true'

      - name: Upload frontend smoke Playwright report (flake tracking)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-frontend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/blob-report/
          if-no-files-found: warn
          retention-days: 14

  # ── Frontend E2E: heavy (WS/lifecycle) ──────────────────────────────────────
  # WebSocket lifecycle, wallet payment flow and remaining suites.
  # Required but decoupled from smoke; flaky WS tests get 2 retries in config + outer retry.
  e2e-frontend-heavy:
    name: e2e-frontend-heavy (WS/lifecycle)
    needs: [frontend, changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run frontend heavy E2E (with auto-retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 10
          command: cd frontend && npx playwright test tests/e2e/task-monitoring.spec.ts tests/e2e/wallet.spec.ts tests/e2e/i18n.spec.ts --reporter=html
        env:
          CI: 'true'

      - name: Upload frontend heavy Playwright report (flake tracking)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-frontend-heavy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/blob-report/
          if-no-files-found: warn
          retention-days: 14

  # ── PR coverage comment reporter ────────────────────────────────────────────
  # Posts (or updates) a sticky PR comment with a per-component coverage table.
  # Runs only on pull_request events; skipped on push/dispatch so it does not
  # fail main-branch runs where the comment action has nothing to post to.
  coverage-report:
    name: coverage-report
    if: github.event_name == 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-${{ github.run_id }}
          path: coverage/backend
        continue-on-error: true

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-${{ github.run_id }}
          path: coverage/frontend
        continue-on-error: true

      - name: Build coverage summary
        id: summary
        run: |
          extract() {
            local file="$1"
            if [ -f "$file" ]; then
              python3 - "$file" <<'EOF'
          import json, sys
          data = json.load(open(sys.argv[1]))
          t = data.get("total", {})
          lines   = t.get("lines",   {}).get("pct", "n/a")
          stmts   = t.get("statements", {}).get("pct", "n/a")
          funcs   = t.get("functions", {}).get("pct", "n/a")
          branches = t.get("branches", {}).get("pct", "n/a")
          print(f"{lines}%|{stmts}%|{funcs}%|{branches}%")
          EOF
            else
              echo "n/a|n/a|n/a|n/a"
            fi
          }
          BE=$(extract coverage/backend/coverage-summary.json)
          FE=$(extract coverage/frontend/coverage-summary.json)
          BE_LINES=$(echo "$BE" | cut -d'|' -f1)
          BE_STMTS=$(echo "$BE" | cut -d'|' -f2)
          BE_FUNCS=$(echo "$BE" | cut -d'|' -f3)
          BE_BR=$(echo "$BE" | cut -d'|' -f4)
          FE_LINES=$(echo "$FE" | cut -d'|' -f1)
          FE_STMTS=$(echo "$FE" | cut -d'|' -f2)
          FE_FUNCS=$(echo "$FE" | cut -d'|' -f3)
          FE_BR=$(echo "$FE" | cut -d'|' -f4)
          {
            echo 'MESSAGE<<EOF'
            echo '## CI Coverage Summary'
            echo ''
            echo '| Component | Lines | Statements | Functions | Branches | Status |'
            echo '|-----------|-------|------------|-----------|----------|--------|'
            echo "| **Backend**  | $BE_LINES | $BE_STMTS | $BE_FUNCS | $BE_BR | ${{ needs.backend.result == 'success' && '✅' || '❌' }} |"
            echo "| **Frontend** | $FE_LINES | $FE_STMTS | $FE_FUNCS | $FE_BR | ${{ needs.frontend.result == 'success' && '✅' || '❌' }} |"
            echo ''
            echo "_Generated for commit \`${{ github.sha }}\` — [full run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-coverage
          message: ${{ steps.summary.outputs.MESSAGE }}

  # ── Required aggregator gate ────────────────────────────────────────────────
  # ── Docker Compose integration (issue #753) ─────────────────────────────────
  # Builds the real backend image and runs tests/e2e/compose-smoke.mjs against
  # the compose `test` profile (Stellar standalone + backend), then checks the
  # backend exits cleanly on SIGTERM. Catches image, wiring and env breakage
  # that the in-process suites cannot see.
  integration-compose:
    name: integration-compose
    needs: [changes]
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.compose == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (GitHub Actions layer cache)
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: backend
          load: true
          set: |
            backend.cache-from=type=gha,scope=compose-backend
            backend.cache-to=type=gha,mode=max,scope=compose-backend

      - name: Run compose smoke suite
        run: docker compose --profile test up --no-build --exit-code-from smoke smoke

      - name: Check graceful shutdown
        run: |
          docker compose stop -t 30 backend
          code=$(docker compose ps -a backend --format '{{.ExitCode}}')
          echo "backend exit code: $code"
          test "$code" = "0"

      - name: Collect compose logs
        if: failure()
        run: docker compose --profile test logs --no-color --timestamps > compose-logs.txt

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: compose-logs.txt
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose --profile test down -v

  # Branch protection should require this single check. It passes only when all
  # non-skipped dependencies succeeded; skipped (path-filtered) counts as success
  # so frontend-only or backend-only PRs can still be green.
  ci-gate:
    name: ci-gate (required)
    if: always()
    needs:
      [
        changes,
        backend,
        frontend,
        contracts,
        e2e-backend-smoke,
        e2e-backend-heavy,
        e2e-frontend-smoke,
        e2e-frontend-heavy,
        integration-compose,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate CI results (skipped = success for path-filtered PRs)
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "backend: ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          echo "contracts: ${{ needs.contracts.result }}"
          echo "e2e-backend-smoke: ${{ needs.e2e-backend-smoke.result }}"
          echo "e2e-backend-heavy: ${{ needs.e2e-backend-heavy.result }}"
          echo "e2e-frontend-smoke: ${{ needs.e2e-frontend-smoke.result }}"
          echo "e2e-frontend-heavy: ${{ needs.e2e-frontend-heavy.result }}"
          echo "integration-compose: ${{ needs.integration-compose.result }}"

          fail=0
          for job in "${{ needs.changes.result }}" "${{ needs.backend.result }}" "${{ needs.frontend.result }}" "${{ needs.contracts.result }}" "${{ needs.integration-compose.result }}"; do
            if [[ "$job" == "failure" || "$job" == "cancelled" ]]; then
              echo "❌ Required job failed: $job"
              fail=1
            fi
          done
          for job in "${{ needs.e2e-backend-smoke.result }}" "${{ needs.e2e-backend-heavy.result }}" "${{ needs.e2e-frontend-smoke.result }}" "${{ needs.e2e-frontend-heavy.result }}"; do
            if [[ "$job" == "failure" || "$job" == "cancelled" ]]; then
              echo "❌ E2E job failed: $job"
              fail=1
            fi
            # skipped is OK (path-filtered), success is OK
          done

          if [[ $fail -ne 0 ]]; then
            echo "❌ ci-gate failed — one or more required jobs failed"
            exit 1
          fi
          echo "✅ ci-gate passed — all required jobs succeeded (or were correctly skipped)"

  contracts-integration:
    name: contracts-integration
    continue-on-error: true
    needs: contracts
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STELLAR_COORDINATOR_SECRET: ${{ secrets.STELLAR_COORDINATOR_SECRET }}
      VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
    defaults:
      run:
        working-directory: smart-contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: smart-contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        if: env.STELLAR_COORDINATOR_SECRET != '' && env.VENICE_API_KEY != ''
        run: npm run test:integration
        env:
          RUN_INTEGRATION_TESTS: 'true'

      - name: Skip notice
        if: env.STELLAR_COORDINATOR_SECRET == '' || env.VENICE_API_KEY == ''
        run: echo "Integration secrets not configured — skipping integration tests."

  # ── Security scanning (issue #854) ──────────────────────────────────────────
  # Advisory jobs, deliberately NOT wired into `ci-gate`: a flaky upstream
  # scanner must never block a feature PR, while findings still surface on
  # every run. Branch protection may require them separately if desired.
  security-audit:
    name: security-audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Audit dependencies (fail on high+)
        run: npm audit --audit-level=high

  secret-scan:
    name: secret-scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan git history for leaked credentials
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  container-scan:
    name: container-scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t ai-net-backend:scan .

      - name: Scan image for HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ai-net-backend:scan
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
