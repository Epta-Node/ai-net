name: Contract Release Artifacts

# Builds optimized Wasm binaries for the deployable contracts and attaches
# them (with checksums) to a published GitHub release. Day-to-day checks live
# in ci.yml — this workflow only produces release artifacts.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Wasm artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: smart-contracts

      - name: Build optimized Wasm binaries
        working-directory: smart-contracts
        run: |
          cargo build --locked -p agent-registry --target wasm32v1-none --release
          cargo build --locked -p error-registry --target wasm32v1-none --release
          ls -la target/wasm32v1-none/release/*.wasm

      - name: Generate checksums
        working-directory: smart-contracts
        run: |
          cd target/wasm32v1-none/release
          sha256sum ./*.wasm > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: contract-wasm-${{ github.sha }}
          path: |
            smart-contracts/target/wasm32v1-none/release/*.wasm
            smart-contracts/target/wasm32v1-none/release/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: Attach artifacts to release
        if: github.event_name == 'release'
        working-directory: smart-contracts/target/wasm32v1-none/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            *.wasm SHA256SUMS.txt \
            --clobber
