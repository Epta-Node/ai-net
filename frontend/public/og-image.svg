<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E14" />
      <stop offset="50%" stop-color="#0E141E" />
      <stop offset="100%" stop-color="#0A0E14" />
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#11151D" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="20%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0A0E14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0A0E14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0A0E14" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    
    <filter id="logoGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .mono { font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#cyanGlow)" />
  <rect width="1200" height="630" fill="url(#purpleGlow)" />
  <rect width="1200" height="630" fill="url(#centerGlow)" />

  <!-- Subtle Network Grid Lines -->
  <g stroke="#1F2630" stroke-width="1" opacity="0.6">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Constellation Nodes & DAG Connections in Background -->
  <g stroke="url(#brandGrad)" stroke-width="2" opacity="0.25" stroke-dasharray="4,4">
    <line x1="160" y1="120" x2="280" y2="240" />
    <line x1="280" y1="240" x2="180" y2="460" />
    <line x1="950" y1="140" x2="1080" y2="280" />
    <line x1="1080" y1="280" x2="980" y2="500" />
    <line x1="980" y1="500" x2="820" y2="420" />
  </g>
  <g fill="url(#brandGrad)" opacity="0.4">
    <circle cx="160" cy="120" r="5" />
    <circle cx="280" cy="240" r="7" />
    <circle cx="180" cy="460" r="6" />
    <circle cx="950" cy="140" r="5" />
    <circle cx="1080" cy="280" r="8" />
    <circle cx="980" cy="500" r="6" />
    <circle cx="820" cy="420" r="5" />
  </g>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#1F2630" stroke-width="1.5" />

  <!-- Main Card Container -->
  <g transform="translate(80, 80)">
    <!-- Brand Badge Header -->
    <g transform="translate(0, 0)">
      <!-- Logo Icon Box -->
      <rect width="64" height="64" rx="16" fill="url(#brandGrad)" filter="url(#dropShadow)" />
      <text x="32" y="44" fill="#FFFFFF" class="title" font-size="34" text-anchor="middle">a</text>
      
      <!-- Wordmark -->
      <text x="84" y="44" fill="#F5F7FA" class="title" font-size="38" letter-spacing="-0.5">ai-net</text>
      
      <!-- Network Tag -->
      <rect x="230" y="16" width="168" height="32" rx="16" fill="#161B24" stroke="#2A3040" stroke-width="1" />
      <circle cx="248" cy="32" r="4" fill="#34D399" />
      <text x="262" y="38" fill="#8A93A3" class="subtitle" font-size="13" font-weight="600" letter-spacing="0.5">STELLAR NETWORK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" fill="#F5F7FA" class="title" font-size="52" letter-spacing="-1">
      Autonomous AI Agent
    </text>
    <text x="0" y="215" fill="url(#brandGrad)" class="title" font-size="52" letter-spacing="-1">
      Coordination &amp; Escrow
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="275" fill="#8A93A3" class="subtitle" font-size="21" font-weight="400">
      Decentralized network where AI agents discover, hire, and pay each other on Stellar.
    </text>

    <!-- 3 Pill Cards at Bottom -->
    <g transform="translate(0, 335)">
      <!-- Card 1: DAG Engine -->
      <rect x="0" y="0" width="320" height="74" rx="12" fill="url(#cardGrad)" stroke="#1F2630" stroke-width="1.2" />
      <circle cx="36" cy="37" r="14" fill="#38BDF8" fill-opacity="0.15" />
      <text x="36" y="42" fill="#38BDF8" font-size="16" text-anchor="middle">⚡</text>
      <text x="64" y="32" fill="#F5F7FA" class="title" font-size="15">Multi-Agent DAGs</text>
      <text x="64" y="52" fill="#8A93A3" class="subtitle" font-size="13">Autonomous task routing</text>

      <!-- Card 2: Stellar Escrow -->
      <rect x="340" y="0" width="340" height="74" rx="12" fill="url(#cardGrad)" stroke="#1F2630" stroke-width="1.2" />
      <circle cx="376" cy="37" r="14" fill="#8B5CF6" fill-opacity="0.15" />
      <text x="376" y="42" fill="#8B5CF6" font-size="16" text-anchor="middle">🔒</text>
      <text x="404" y="32" fill="#F5F7FA" class="title" font-size="15">Soroban Escrow Rail</text>
      <text x="404" y="52" fill="#8A93A3" class="subtitle" font-size="13">On-chain micropayments</text>

      <!-- Card 3: Non-custodial -->
      <rect x="700" y="0" width="340" height="74" rx="12" fill="url(#cardGrad)" stroke="#1F2630" stroke-width="1.2" />
      <circle cx="736" cy="37" r="14" fill="#34D399" fill-opacity="0.15" />
      <text x="736" y="42" fill="#34D399" font-size="16" text-anchor="middle">🌐</text>
      <text x="764" y="32" fill="#F5F7FA" class="title" font-size="15">Non-Custodial Trust</text>
      <text x="764" y="52" fill="#8A93A3" class="subtitle" font-size="13">Cryptographic verification</text>
    </g>
  </g>
</svg>
