<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="aiNetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="#0A0E14" />
  <rect width="62" height="62" x="1" y="1" rx="13" fill="url(#glowGrad)" stroke="#1F2630" stroke-width="1" />

  <!-- Autonomous Agent Mesh Lines -->
  <g stroke="url(#aiNetGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <line x1="16" y1="20" x2="32" y2="12" />
    <line x1="32" y1="12" x2="48" y2="20" />
    <line x1="48" y1="20" x2="48" y2="44" />
    <line x1="48" y1="44" x2="32" y2="52" />
    <line x1="32" y1="52" x2="16" y2="44" />
    <line x1="16" y1="44" x2="16" y2="20" />
    <line x1="16" y1="20" x2="32" y2="32" />
    <line x1="48" y1="20" x2="32" y2="32" />
    <line x1="32" y1="52" x2="32" y2="32" />
  </g>

  <!-- Node Dots -->
  <g fill="url(#aiNetGrad)" filter="url(#glow)">
    <circle cx="16" cy="20" r="2.8" />
    <circle cx="32" cy="12" r="3.2" />
    <circle cx="48" cy="20" r="2.8" />
    <circle cx="48" cy="44" r="2.8" />
    <circle cx="32" cy="52" r="3.2" />
    <circle cx="16" cy="44" r="2.8" />
    <circle cx="32" cy="32" r="4.2" fill="#38BDF8" />
  </g>

  <!-- Center Core Accent -->
  <circle cx="32" cy="32" r="2" fill="#FFFFFF" />
</svg>
